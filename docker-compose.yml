services:
  db:
    image: postgres:16
    container_name: tool-vision-followups-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=toolvf
      - POSTGRES_PASSWORD=toolvf
      - POSTGRES_DB=tool_vision_followups
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolvf -d tool_vision_followups"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
